<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ED Roster &amp; Requests — Moved</title>
    <meta http-equiv="refresh" content="1;url=https://dr-afif.github.io/ED-Roster/" />
    <link rel="icon" type="image/png" href="./logo-ed-hsaas.png" />
    <meta name="theme-color" content="#18181B" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        background: radial-gradient(circle at top, rgba(15, 118, 110, 0.08), transparent 55%), #FAF8F5;
        color: #18181B;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #FFFFFF;
        border: 1px solid #E7E5E4;
        border-radius: 28px;
        padding: 34px 26px 28px;
        text-align: center;
        box-shadow: 0 18px 40px -16px rgba(24, 24, 27, 0.12);
      }
      .logo {
        width: 76px;
        height: 76px;
        border-radius: 9999px;
        object-fit: cover;
        margin: 0 auto 16px;
        display: block;
        box-shadow: 0 6px 18px rgba(24, 24, 27, 0.12);
      }
      .eyebrow {
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #0F766E;
        margin-bottom: 6px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #18181B;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 9999px;
        background: #F0FDFA;
        border: 1px solid #CCFBF1;
        color: #0F766E;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 20px;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 9999px;
        background: #0F766E;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 13px 20px;
        border-radius: 9999px;
        background: #18181B;
        color: #FFFFFF;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: opacity 0.15s ease;
      }
      .btn:hover { opacity: 0.9; }
      .hint {
        margin: 16px 0 0;
        font-size: 11.5px;
        line-height: 1.5;
        color: #78716C;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="./logo-ed-hsaas.png" alt="ED HSAAS UPM" class="logo" />
      <div class="eyebrow">Emergency Department · HSAAS UPM</div>
      <h1>ED Roster &amp; Requests</h1>
      <div class="status">
        <span class="dot" aria-hidden="true"></span>
        <span>Opening the new app…</span>
      </div>
      <a class="btn" href="https://dr-afif.github.io/ED-Roster/">Continue to ED Roster &rarr;</a>
      <p class="hint">
        Using an old Home Screen shortcut? Install the new app once it opens and remove this shortcut.
      </p>
    </main>
    <script>
      (function () {
        var targetUrl = 'https://dr-afif.github.io/ED-Roster/';
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          }).catch(function () {});
        }
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          }).catch(function () {});
        }
        setTimeout(function () {
          window.location.replace(targetUrl);
        }, 350);
      })();
    </script>
  </body>
</html>
