<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RESQ Workforce &amp; Roster — Moved</title>
    <meta http-equiv="refresh" content="1;url=https://dr-afif.github.io/ED-Roster/" />
    <link rel="icon" type="image/png" href="./logo-ed-hsaas.png" />
    <meta name="theme-color" content="#18181B" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        background: #FAF8F5;
        color: #18181B;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #FFFFFF;
        border: 1px solid #E7E5E4;
        border-radius: 24px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 12px 32px -12px rgba(24, 24, 27, 0.12);
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 9999px;
        object-fit: cover;
        margin: 0 auto 16px;
        display: block;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 18px;
        font-size: 13.5px;
        line-height: 1.5;
        color: #57534E;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 12px 18px;
        border-radius: 9999px;
        background: #0F766E;
        color: #FFFFFF;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }
      .hint {
        margin-top: 14px;
        font-size: 11.5px;
        color: #78716C;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="./logo-ed-hsaas.png" alt="ED HSAAS UPM" class="logo" />
      <h1>RESQ Workforce &amp; Roster Has Moved</h1>
      <p>
        Redirecting you to the new modular ED Roster &amp; Requests app at
        <strong>dr-afif.github.io/ED-Roster</strong>...
      </p>
      <a class="btn" href="https://dr-afif.github.io/ED-Roster/">Open New RESQ ED App &rarr;</a>
      <p class="hint">
        Using an old Home Screen shortcut? Open the new app and tap
        <strong>Install / Add to Home Screen</strong>, then remove this old shortcut.
      </p>
    </main>
    <script>
      (function () {
        var targetUrl = 'https://dr-afif.github.io/ED-Roster/';
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.unregister(); });
          }).catch(function () {});
        }
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          }).catch(function () {});
        }
        setTimeout(function () {
          window.location.replace(targetUrl);
        }, 400);
      })();
    </script>
  </body>
</html>
